<h2>你更喜欢哪种视觉风格？</h2>
<p class="subtitle">选择一个整体风格方向，后续布局和细节都延展这个风格</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>清新自然风</h3>
      <p>绿色/薄荷色调，圆角卡片，轻盈的图标，传递健康、自然的感觉。适合食物/营养类产品。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>现代极简风</h3>
      <p>黑白灰为主，极少的装饰，大留白，突出数据本身。像 Apple Health 的风格——冷静、精准。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>活力暖色风</h3>
      <p>橙色/暖黄色渐变，大色块卡片，传递能量和动力感。适合强调"目标达成"的激励类应用。</p>
    </div>
  </div>
</div>
